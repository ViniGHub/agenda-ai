<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the app may draw under the iPhone's home indicator; the layout pads it back. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pergunte em português sobre a sua agenda e anote compromissos por texto ou voz." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7dcc8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12110f" />
    <!-- Installed on the iPhone home screen: full screen, its own name, dark status bar text. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Agenda IA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icone.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Agenda IA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
