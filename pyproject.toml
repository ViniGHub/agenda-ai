[project]
name = "agenda-ia"
version = "0.1.0"
description = "Pergunte em português sobre a sua agenda: RAG com filtro de datas, busca híbrida e citação dos compromissos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.11",
    "icalendar>=6.0",
    "recurring-ical-events>=3.3",
    "numpy>=1.26",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.6",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110", "uvicorn>=0.29", "google-auth>=2.30", "requests>=2.31", "itsdangerous>=2.2",
    "psycopg[binary]>=3.2", "psycopg-pool>=3.2",
]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
